[project]
name = "chinese-learner"
version = "0.1.0"
description = "HSK vocabulary drills with LLM-backed cards, Leitner SRS, NiceGUI dashboard"
requires-python = ">=3.12"
dependencies = [
    "nicegui>=2.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pypinyin>=0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learner"]

[tool.uv]
dev-dependencies = []
